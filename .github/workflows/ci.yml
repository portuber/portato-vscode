# CI: lint, typecheck, bundle, hermetic unit tests, and a packaged .vsix on
# every push and pull request. Integration tests (npm run test:integration)
# are deliberately NOT run here: they need a real `portato` daemon binary,
# which lives in the separate portato Go repo; they run on dev machines with
# $PORTATO_BINARY or /opt/homebrew/bin/portato present.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run compile
      - run: npm test
      - name: Package
        run: npm run package
      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: portato-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error
