# CI: lint, typecheck, bundle, unit tests, integration tests against a real
# pinned portato daemon, and a packaged .vsix on every push and pull request.
# The integration suite downloads the portato binary from the Go repo's
# GitHub release (PORTATO_VERSION below, kept at MIN_DAEMON_VERSION --
# src/daemonVersion.ts) and points the tests at it via PORTATO_BINARY;
# locally the same suite falls back to $PORTATO_BINARY or
# /opt/homebrew/bin/portato and skips when neither is present.
# Actions are pinned to commit SHAs; Dependabot proposes the bumps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PORTATO_VERSION: v1.11.0

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run compile
      - run: npm test
      - name: Fetch the portato daemon binary
        run: |
          # goreleaser keeps the raw .Os/.Arch (only darwin is rewritten to
          # macOS), so map uname output explicitly: Linux -> linux,
          # aarch64 -> arm64.
          case "$(uname -s)" in
            Darwin) os=macOS ;;
            Linux) os=linux ;;
            *) echo "unsupported OS: $(uname -s)"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=x86_64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/portuber/portato/releases/download/${PORTATO_VERSION}/portato_${PORTATO_VERSION#v}_${os}_${arch}.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" | tar -xz portato
          ./portato version
      - name: Integration tests
        env:
          PORTATO_BINARY: ${{ github.workspace }}/portato
        run: npm run test:integration
      - name: Package
        run: npm run package
      - name: Upload .vsix
        # One artifact per commit is enough; packaging is node-only, so the
        # ubuntu build carries it.
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portato-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error
