# Dependabot: weekly update proposals for the dev dependencies (the shipped
# extension has zero runtime dependencies) and for the commit-SHA-pinned
# actions in .github/workflows. Commits follow the repo's Conventional
# Commits rule; PRs are plain proposals -- nothing merges without review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
    ignore:
      # @types/node must track the extension host's Node (Node 20 for
      # engines.vscode ^1.90), not the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript >=6.1.0 (the v7 Go-port era) is outside
      # typescript-eslint's peer range.
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
